name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Install Godot + export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates *.zip *.tpz
          mkdir -p ~/.config/godot
          keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Set version
        run: |
          B=${{ github.run_number }}
          sed -i "s/^config\/build=.*/config\/build=$B/; s/^config\/version=.*/config\/version=\"0.1.$B\"/" project.godot
          sed -i "s/^version\/code=.*/version\/code=$B/; s/^version\/name=.*/version\/name=\"0.1.$B\"/" export_presets.cfg

      - name: Decrypt release keystore
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          test -n "$KEYSTORE_PASS" || { echo "Missing secret KEYSTORE_PASS"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -in android/release.keystore.enc -out $HOME/release.keystore -pass env:KEYSTORE_PASS

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: nicecrash
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p build
          godot --headless --import 2>&1 | tail -20 || true
          godot --headless --export-release "Android" build/NiceCrash.apk 2>&1 | tee build/export.log
          test -f build/NiceCrash.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Nice Crash! build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: build/NiceCrash.apk
          make_latest: true

      - name: Save failure log for Claude
        if: failure()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp build/export.log /tmp/export.log 2>/dev/null || echo "no export log" > /tmp/export.log
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rfq --cached . >/dev/null 2>&1 || true
          cp /tmp/export.log last-failure.log
          echo "run ${{ github.run_number }} failed at $(date -u)" >> last-failure.log
          git add -f last-failure.log
          git commit -qm "CI failure log run ${{ github.run_number }}"
          git push -f origin ci-logs
